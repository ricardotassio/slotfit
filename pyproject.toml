[project]
name = "slotfit"
version = "0.1.0"
description = "Explainable scheduling optimization experiment using synthetic clinic calendars"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "httpx2==2.13.0",
    "ortools==9.15.6755",
    "pydantic==2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slotfit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

